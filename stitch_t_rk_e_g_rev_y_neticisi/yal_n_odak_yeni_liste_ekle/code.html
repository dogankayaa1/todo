<!DOCTYPE html>

<html class="light" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Yalın Odak - Yeni Liste Ekle</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-surface": "#191c1e",
                    "on-primary-fixed-variant": "#0040a2",
                    "on-tertiary-fixed-variant": "#812800",
                    "on-secondary": "#ffffff",
                    "error": "#ba1a1a",
                    "tertiary": "#7b2600",
                    "on-primary-fixed": "#001848",
                    "on-background": "#191c1e",
                    "secondary-fixed": "#dce3f0",
                    "tertiary-container": "#a33500",
                    "on-error": "#ffffff",
                    "surface-container": "#edeef0",
                    "secondary-container": "#dce3f0",
                    "surface-container-lowest": "#ffffff",
                    "tertiary-fixed-dim": "#ffb59b",
                    "on-tertiary-container": "#ffc6b2",
                    "surface-container-highest": "#e1e2e4",
                    "outline-variant": "#c3c6d6",
                    "inverse-on-surface": "#f0f1f3",
                    "on-tertiary": "#ffffff",
                    "primary-fixed": "#dae2ff",
                    "on-surface-variant": "#434654",
                    "surface-dim": "#d9dadc",
                    "secondary-fixed-dim": "#c0c7d3",
                    "primary-fixed-dim": "#b2c5ff",
                    "tertiary-fixed": "#ffdbcf",
                    "on-primary-container": "#c4d2ff",
                    "on-primary": "#ffffff",
                    "secondary": "#585f6a",
                    "primary": "#003d9b",
                    "surface-variant": "#e1e2e4",
                    "outline": "#737685",
                    "surface": "#f8f9fb",
                    "on-error-container": "#93000a",
                    "surface-container-low": "#f3f4f6",
                    "background": "#f8f9fb",
                    "surface-container-high": "#e7e8ea",
                    "on-secondary-container": "#5e6570",
                    "inverse-surface": "#2e3132",
                    "inverse-primary": "#b2c5ff",
                    "on-secondary-fixed-variant": "#404751",
                    "error-container": "#ffdad6",
                    "primary-container": "#0052cc",
                    "on-secondary-fixed": "#151c25",
                    "surface-bright": "#f8f9fb",
                    "surface-tint": "#0c56d0",
                    "on-tertiary-fixed": "#380d00"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "xs": "4px",
                    "md": "16px",
                    "gutter": "20px",
                    "xl": "40px",
                    "base-unit": "4px",
                    "container-max": "800px",
                    "lg": "24px",
                    "sm": "8px"
            },
            "fontFamily": {
                    "headline-md": ["Inter"],
                    "display-lg": ["Inter"],
                    "body-sm": ["Inter"],
                    "body-base": ["Inter"],
                    "display-lg-mobile": ["Inter"],
                    "label-caps": ["Inter"],
                    "label-bold": ["Inter"]
            },
            "fontSize": {
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "body-base": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "display-lg-mobile": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "label-caps": ["11px", {"lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "700"}],
                    "label-bold": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #f8f9fb;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .color-dot-active {
            outline: 2px solid #003d9b;
            outline-offset: 2px;
        }
        .icon-box-active {
            background-color: rgba(0, 82, 204, 0.1);
            color: #003d9b;
            border-color: #003d9b;
        }
        .glass-morphism {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(225, 228, 232, 0.5);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-gutter">
<!-- Top Navigation Anchor (Suppressed based on Transactional Task focus, but using style_brand_logo for visual consistency) -->
<div class="fixed top-0 left-0 w-full px-gutter py-md flex justify-center pointer-events-none">
<h1 class="font-display-lg text-display-lg font-bold text-primary opacity-20 select-none">Yalın Odak</h1>
</div>
<!-- Main Content Canvas -->
<main class="w-full max-w-[500px] z-10">
<!-- New List Card -->
<div class="bg-white border border-outline-variant rounded-xl overflow-hidden transition-all duration-300">
<!-- Progress Bar (Themed) -->
<div class="h-1 w-full bg-surface-container">
<div class="h-full bg-primary-container w-1/3 transition-all duration-500 ease-out"></div>
</div>
<div class="p-xl space-y-lg">
<!-- Header -->
<div class="text-center space-y-xs">
<h2 class="font-headline-md text-headline-md text-on-surface">Yeni Liste Ekle</h2>
<p class="font-body-sm text-body-sm text-secondary">Odaklanmak istediğiniz yeni bir kategori oluşturun.</p>
</div>
<!-- Form Section -->
<form class="space-y-lg" onsubmit="event.preventDefault();">
<!-- List Name Input -->
<div class="space-y-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant" for="list-name">Liste Adı</label>
<input class="w-full h-12 px-md border border-outline-variant rounded-lg bg-surface-container-lowest focus:ring-2 focus:ring-primary-container/20 focus:border-primary outline-none transition-all font-body-base text-body-base" id="list-name" placeholder="Örn: Haftalık Hedefler" type="text"/>
</div>
<!-- Color Selection -->
<div class="space-y-sm">
<label class="font-label-bold text-label-bold text-on-surface-variant block">Renk Seçimi</label>
<div class="flex flex-wrap gap-md justify-between px-xs">
<button class="w-8 h-8 rounded-full bg-[#003d9b] color-dot-active transform active:scale-90 transition-transform" type="button"></button>
<button class="w-8 h-8 rounded-full bg-[#7b2600] transform active:scale-90 transition-transform" type="button"></button>
<button class="w-8 h-8 rounded-full bg-[#1b6b3e] transform active:scale-90 transition-transform" type="button"></button>
<button class="w-8 h-8 rounded-full bg-[#6750a4] transform active:scale-90 transition-transform" type="button"></button>
<button class="w-8 h-8 rounded-full bg-[#93000a] transform active:scale-90 transition-transform" type="button"></button>
<button class="w-8 h-8 rounded-full bg-[#006a6a] transform active:scale-90 transition-transform" type="button"></button>
</div>
</div>
<!-- Icon Selection -->
<div class="space-y-sm">
<label class="font-label-bold text-label-bold text-on-surface-variant block">İkon Seçimi</label>
<div class="grid grid-cols-4 gap-sm">
<button class="flex items-center justify-center h-12 border border-outline-variant rounded-lg hover:bg-surface-container transition-colors active:scale-95 icon-box-active" type="button">
<span class="material-symbols-outlined" data-icon="inbox">inbox</span>
</button>
<button class="flex items-center justify-center h-12 border border-outline-variant rounded-lg hover:bg-surface-container transition-colors active:scale-95" type="button">
<span class="material-symbols-outlined" data-icon="star">star</span>
</button>
<button class="flex items-center justify-center h-12 border border-outline-variant rounded-lg hover:bg-surface-container transition-colors active:scale-95" type="button">
<span class="material-symbols-outlined" data-icon="work">work</span>
</button>
<button class="flex items-center justify-center h-12 border border-outline-variant rounded-lg hover:bg-surface-container transition-colors active:scale-95" type="button">
<span class="material-symbols-outlined" data-icon="shopping_cart">shopping_cart</span>
</button>
<button class="flex items-center justify-center h-12 border border-outline-variant rounded-lg hover:bg-surface-container transition-colors active:scale-95" type="button">
<span class="material-symbols-outlined" data-icon="school">school</span>
</button>
<button class="flex items-center justify-center h-12 border border-outline-variant rounded-lg hover:bg-surface-container transition-colors active:scale-95" type="button">
<span class="material-symbols-outlined" data-icon="fitness_center">fitness_center</span>
</button>
<button class="flex items-center justify-center h-12 border border-outline-variant rounded-lg hover:bg-surface-container transition-colors active:scale-95" type="button">
<span class="material-symbols-outlined" data-icon="home">home</span>
</button>
<button class="flex items-center justify-center h-12 border border-outline-variant rounded-lg hover:bg-surface-container transition-colors active:scale-95" type="button">
<span class="material-symbols-outlined" data-icon="more_horiz">more_horiz</span>
</button>
</div>
</div>
<!-- Actions -->
<div class="pt-md flex flex-col gap-sm">
<button class="w-full bg-primary-container text-white py-md rounded-lg font-label-bold text-label-bold hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-sm shadow-sm" type="submit">
<span class="material-symbols-outlined text-[18px]" data-icon="add">add</span>
                            Yeni Liste Oluştur
                        </button>
<button class="w-full bg-transparent text-secondary py-md rounded-lg font-label-bold text-label-bold hover:bg-surface-container-low active:scale-[0.98] transition-all" type="button">
                            İptal Et
                        </button>
</div>
</form>
</div>
</div>
<!-- Descriptive Visual Asset Placeholder -->
<div class="mt-xl text-center opacity-40">
<div class="inline-flex items-center gap-sm">
<span class="w-2 h-2 rounded-full bg-primary"></span>
<span class="font-label-caps text-label-caps tracking-widest uppercase">Dijital Zen</span>
<span class="w-2 h-2 rounded-full bg-primary"></span>
</div>
</div>
</main>
<!-- Visual Decoration (Asymmetric Layout Elements) -->
<div class="fixed -bottom-12 -left-12 w-64 h-64 bg-primary-container/5 rounded-full blur-3xl -z-10"></div>
<div class="fixed -top-12 -right-12 w-96 h-96 bg-secondary-container/5 rounded-full blur-3xl -z-10"></div>
<script>
        // Simple Interaction Logic
        document.querySelectorAll('button[type="button"]').forEach(btn => {
            // Handle color selection visually
            if (btn.classList.contains('rounded-full') && btn.parentElement.classList.contains('justify-between')) {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.rounded-full.color-dot-active').forEach(dot => dot.classList.remove('color-dot-active'));
                    btn.classList.add('color-dot-active');
                });
            }
            
            // Handle icon selection visually
            if (btn.querySelector('.material-symbols-outlined')) {
                btn.addEventListener('click', () => {
                    const parent = btn.parentElement;
                    if (parent.classList.contains('grid-cols-4')) {
                        document.querySelectorAll('.icon-box-active').forEach(box => box.classList.remove('icon-box-active'));
                        btn.classList.add('icon-box-active');
                    }
                });
            }
        });

        // Hover Effect Shadow Logic (Level 2 Interaction from Style Guide)
        const mainCard = document.querySelector('.bg-white');
        mainCard.addEventListener('mouseenter', () => {
            mainCard.style.boxShadow = '0 4px 12px rgba(0, 0, 0, 0.05)';
        });
        mainCard.addEventListener('mouseleave', () => {
            mainCard.style.boxShadow = 'none';
        });
    </script>
</body></html>
