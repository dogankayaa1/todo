<div class="relative group">

<input class="w-full pl-10 pr-md py-md bg-white border border-outline-variant rounded-lg font-body-base text-body-base focus:border-primary focus:outline-none input-glow transition-all" id="email" name="email" placeholder="adiniz@ornek.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-bold text-label-bold text-on-surface-variant block" for="password">Şifre</label>

</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-10 pr-md py-md bg-white border border-outline-variant rounded-lg font-body-base text-body-base focus:border-primary focus:outline-none input-glow transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>

</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-label-bold text-label-bold py-md px-lg rounded-lg hover:bg-primary-container active:scale-[0.98] transition-all flex justify-center items-center gap-sm" type="submit">
                    Giriş Yap
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Social Login Divider -->
<div class="relative my-lg">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-xs">

<script>
        // Micro-interactions
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            // Show loading state
            btn.disabled = true;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">progress_activity</span>`;
            
            // Simulate API call
            setTimeout(() => {
                btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span>`;
                btn.classList.replace('bg-primary', 'bg-green-600');
                
                setTimeout(() => {
                    alert('Yalın Odak dünyasına hoş geldiniz.');
                    btn.disabled = false;
                    btn.innerHTML = originalContent;
                    btn.classList.replace('bg-green-600', 'bg-primary');
                }, 1000);
            }, 1500);
        });

        // Floating label effect simulation or subtle glow on focus is handled via CSS
    </script>
